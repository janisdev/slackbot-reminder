name: Slack Reminder Bot

on:
  # Auto palaišana apturēta: workflow var palaist tikai manuāli
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create config file from Secret
        # Šis solis paņem noslēpumu un izveido failu config.json,
        # lai tavam Python skriptam nebūtu nekas jāmaina.
        run: echo '${{ secrets.APP_CONFIG_JSON }}' > config.json

      - name: Run Slack Bot
        run: python slack_remind.py
        # Nomain 'tavs_skripta_nosaukums.py' uz reālo faila nosaukumu (piem., main.py)
